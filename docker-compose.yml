# Local observability stack for the app, which you run separately with
# `./gradlew bootRun`. Prometheus scrapes the app on the Docker host.
services:

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: observability
      POSTGRES_USER: observability
      POSTGRES_PASSWORD: observability
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U observability"]
      interval: 5s
      timeout: 5s
      retries: 5

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    extra_hosts:
      - "host.docker.internal:host-gateway"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    volumes:
      - ./deploy/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "9093:9093"

  # Tempo runs as UID 10001, but a fresh named volume is root-owned, so fix
  # ownership once before Tempo starts (pattern from Grafana's Tempo examples).
  tempo-init:
    image: grafana/tempo:2.6.1
    user: root
    entrypoint: [ "chown", "10001:10001", "/tmp/tempo" ]
    volumes:
      - tempo-data:/tmp/tempo

  tempo:
    image: grafana/tempo:2.6.1
    depends_on:
      tempo-init:
        condition: service_completed_successfully
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ./deploy/tempo/tempo.yaml:/etc/tempo/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    ports:
      - "4318:4318" # OTLP HTTP (traces)
      - "3200:3200" # Tempo query API

  # Log storage. Distroless image (no shell/wget), so no in-container healthcheck;
  # readiness is http://localhost:3100/ready and Prometheus scrapes its /metrics.
  loki:
    image: grafana/loki:3.7.9
    command: [ "-config.file=/etc/loki/loki.yaml" ]
    volumes:
      - ./deploy/loki/loki.yaml:/etc/loki/loki.yaml:ro
      - loki-data:/loki
    ports:
      - "127.0.0.1:3100:3100" # host access for curl/logcli only; containers use loki:3100
    deploy:
      resources:
        limits:
          memory: 1g

  # Log collector: tails the app's log file from the host and pushes to Loki.
  alloy:
    image: grafana/alloy:v1.21.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
      - --server.http.listen-addr=0.0.0.0:12345
    volumes:
      - ./deploy/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - ./logs:/var/log/app:ro
      - alloy-data:/var/lib/alloy/data # read positions survive restarts
    ports:
      - "127.0.0.1:12345:12345" # pipeline debug UI
    healthcheck:
      # No curl/wget in the image; bash's /dev/tcp is enough for a readiness probe.
      test: [ "CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/12345 && printf 'GET /-/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256m
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - tempo
      - loki

volumes:
  postgres-data:
  prometheus-data:
  tempo-data:
  loki-data:
  alloy-data:
