// Cross-cutting platform code shared by every servlet-based service: request logging,
// RFC 9457 error responses, and JWT resource-server security. Wired by auto-configuration,
// so a service only needs the dependency. Keep business logic out of this module.
dependencies {
    api 'org.springframework.boot:spring-boot-starter-web'
    api 'org.springframework.boot:spring-boot-starter-security'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    api 'org.springframework.boot:spring-boot-starter-validation'
    api 'org.springframework.boot:spring-boot-starter-actuator'

    testImplementation 'org.springframework.security:spring-security-test'
}
