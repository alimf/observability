spring:
  application:
    name: observability

  datasource:
    url: jdbc:postgresql://localhost:5432/observability?currentSchema=app_schema
    username: observability
    password: observability

  flyway:
    enabled: true
    default-schema: app_schema
    schemas: app_schema
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        create_namespaces: true
        default_schema: app_schema

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    circuitbreakers:
      enabled: true

  observations:
    annotations:
      # Enables @Observed (spans + timers) on application methods.
      enabled: true

  tracing:
    sampling:
      # 1.0 locally so every trace ID found in Loki resolves in Tempo.
      # Lower this in production and accept that some log->trace links will 404.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        orders.creation.duration: true
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      paymentClient:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true

  retry:
    instances:
      paymentClient:
        max-attempts: 3
        wait-duration: 200ms


logging:
  file:
    # Tailed by Grafana Alloy (deploy/alloy/config.alloy) through a read-only bind mount.
    name: ${LOG_PATH:logs}/observability.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        environment: ${APP_ENVIRONMENT:local}

  level:
    root: INFO
    org.alim.observability: INFO
