spring:

  application:
    name: observability

  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

  lifecycle:
    timeout-per-shutdown-phase: 30s


management:

  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:

    health:
      probes:
        enabled: true

  tracing:
    sampling:
      probability: 0.1

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true


logging:

  structured:
    format:
      console: ecs

  level:
    root: INFO
    com.example.observability: INFO
