plugins {
    id 'org.springframework.boot' version '3.4.2' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
}

allprojects {
    group = 'org.alim'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'io.spring.dependency-management'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(27)
        }
    }

    // Boot 3.4.2 manages ByteBuddy 1.15.x, which can't instrument Java 27 classes (breaks Mockito).
    ext['byte-buddy.version'] = '1.18.16'

    // Spring Boot 3.4.2's Spring Framework can't read newer class files.
    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    dependencyManagement {
        imports {
            mavenBom org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES
            mavenBom 'org.springframework.cloud:spring-cloud-dependencies:2024.0.0'
        }
    }

    dependencies {
        compileOnly 'org.projectlombok:lombok:1.18.48'
        annotationProcessor 'org.projectlombok:lombok:1.18.48'
        testCompileOnly 'org.projectlombok:lombok:1.18.48'
        testAnnotationProcessor 'org.projectlombok:lombok:1.18.48'

        testImplementation 'org.springframework.boot:spring-boot-starter-test'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }
}

// Deployable services are Spring Boot apps; libs/* are plain libraries.
configure(subprojects.findAll { it.path.startsWith(':services:') }) {
    apply plugin: 'org.springframework.boot'
}

configure(subprojects.findAll { it.path.startsWith(':libs:') }) {
    apply plugin: 'java-library'
}
