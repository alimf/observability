server:
  port: 8082

spring:
  application:
    name: order-service

  datasource:
    url: jdbc:postgresql://localhost:5432/order_db?currentSchema=order_schema
    username: ${DB_USERNAME:order_service}
    password: ${DB_PASSWORD:order_service}

  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens are issued by user-service and verified locally against its published key set.
          # issuer-uri and audiences are only checked against token claims (no discovery call).
          jwk-set-uri: ${USER_SERVICE_JWKS_URI:http://localhost:8081/.well-known/jwks.json}
          issuer-uri: ${JWT_ISSUER:http://localhost:8081}
          audiences: ${JWT_AUDIENCE:observability-api}

  flyway:
    enabled: true
    default-schema: order_schema
    schemas: order_schema
    create-schemas: true
    locations: classpath:db/migration

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        create_namespaces: true
        default_schema: order_schema

  lifecycle:
    timeout-per-shutdown-phase: 30s

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized

  health:
    circuitbreakers:
      enabled: true

  observations:
    annotations:
      # Enables @Observed (spans + timers) on application methods.
      enabled: true

  tracing:
    sampling:
      # 1.0 locally so every trace ID found in Loki resolves in Tempo.
      # Lower this in production and accept that some log->trace links will 404.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
        orders.creation.duration: true
    tags:
      application: ${spring.application.name}

resilience4j:
  circuitbreaker:
    instances:
      paymentClient:
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 5
        register-health-indicator: true

  retry:
    instances:
      paymentClient:
        max-attempts: 3
        wait-duration: 200ms


logging:
  file:
    # Tailed by Grafana Alloy (deploy/alloy/config.alloy) through a read-only bind mount.
    name: ${LOG_PATH:logs}/${spring.application.name}.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        environment: ${APP_ENVIRONMENT:local}

  level:
    root: INFO
    org.alim: INFO
