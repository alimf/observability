# Shadows src/main/resources/application.yaml entirely (same file name on the test classpath).
spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:0
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: order-service
          uri: http://localhost:0
          predicates:
            - Path=/api/v1/orders/**

management:
  tracing:
    sampling:
      probability: 0
