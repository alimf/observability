server:
  port: 8080

spring:
  application:
    name: api-gateway

  lifecycle:
    timeout-per-shutdown-phase: 30s

  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      # Routing only. Authentication is enforced by each service (zero trust between services);
      # the gateway forwards Authorization untouched.
      routes:
        - id: user-service
          uri: ${USER_SERVICE_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**,/api/v1/users/**
        - id: order-service
          uri: ${ORDER_SERVICE_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/orders/**

management:
  endpoints:
    web:
      exposure:
        include:
          - health
          - info
          - metrics
          - prometheus

  endpoint:
    health:
      probes:
        enabled: true

  tracing:
    sampling:
      # 1.0 locally so every trace ID found in Loki resolves in Tempo.
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}

  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
    tags:
      application: ${spring.application.name}

logging:
  file:
    # Tailed by Grafana Alloy (deploy/alloy/config.alloy) through a read-only bind mount.
    name: ${LOG_PATH:logs}/${spring.application.name}.log

  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 200MB

  structured:
    format:
      console: ecs
      file: ecs
    ecs:
      service:
        environment: ${APP_ENVIRONMENT:local}

  level:
    root: INFO
    org.alim: INFO
